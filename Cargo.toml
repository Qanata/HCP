[workspace]
members = ["crates/hcp", "crates/hcp-desktop"]
# The desktop app pulls in Tauri; build it on request (`cargo build -p hcp-desktop` or
# deploy/macos/install-desktop.sh) so plain `cargo build` / `cargo test` stay fast.
default-members = ["crates/hcp"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
